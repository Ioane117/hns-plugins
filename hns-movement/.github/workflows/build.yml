name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Recurse into submodules needed for build
        run: git submodule update --init --recursive metamod-source hl2sdk-cs2

      - name: Make build directory
        run: mkdir ./build

      - name: Build and run Docker image
        run: |
          docker build . --file Dockerfile --tag hns-movement-linux-builder
          docker run -v ./build:/app/build -v ./.git:/app/.git hns-movement-linux-builder

      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: hns-movement-linux
          path: ./build/package

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Recurse into submodules needed for build
        run: git submodule update --init --recursive metamod-source hl2sdk-cs2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone AMBuild
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          path: ./ambuild

      - name: Install AMBuild
        run: python -m pip install ./ambuild

      - name: Make build directory
        run: mkdir ./build

      - name: Configure AMBuild
        working-directory: build
        run: python ../configure.py --enable-optimize

      - name: Run AMBuild
        working-directory: build
        run: ambuild

      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: hns-movement-windows
          path: ./build/package
