// hns-movement configuration. Edit, then run hns_reload (server console or rcon).
// Lives at csgo/cfg/hns-movement/hns-movement.cfg. If it is missing, the plugin writes this default.
//
// Movement cvars listed here are enforced every tick; changing them with the console or a map cfg has no lasting
// effect (the plugin overwrites them and prints a warning). Everything else (game_type, mp_*, bot_*,
// sv_falldamage_scale, mp_solid_enemies) stays in your server cfg.

// ---- Plugin settings ----
hns_ps_enabled            1     // 1 = CS2KZ prestrafe + 250 ground clamp + KZ perf formula. 0 = sv_maxspeed on ground, perf keeps max(landing, takeoff) speed.
hns_perf_requires_jump    1     // 1 = perf speed rewrite only on real jumps (keeps surf speed when skimming/leaving ground). 0 = CS2KZ behaviour.
hns_rampbug_threshold     0.999 // Rampbug fix: dot product below which two normals are different planes (CS2KZ: 0.999).
hns_rampbug_same_plane    0.99  // Rampbug fix: offset trace hitting a plane above this dot product counts as the same ramp (CS2KZ: 0.99).
hns_rampbug_min_distance  1     // Rampbug fix: offset trace must go this much further to be used (CS2KZ: 1.0).
hns_warn_external_change  1     // Warn in console when something else changes an enforced cvar.
hns_debug_perf            0     // Print every takeoff to the server console (development only).

// ---- Movement cvars ----
// Values from the existing HNS server cfg (CVARS.txt); cvars it did not set use the CS2KZ Classic value.
sv_accelerate                      6.5     // CS2KZ: 6.5
sv_accelerate_use_weapon_speed     false   // CS2KZ: false
sv_airaccelerate                   1000    // CS2KZ: 100
sv_air_max_wishspeed               30      // CS2KZ: 30
sv_autobunnyhopping                false   // CS2KZ: false
sv_bounce                          0       // CS2KZ: 0
sv_enablebunnyhopping              true    // CS2KZ: true
sv_friction                        4.05    // CS2KZ: 5.2
sv_gravity                         800     // CS2KZ: 800
sv_jump_impulse                    302     // CS2KZ: 302
sv_jump_precision_enable           false   // CS2KZ: false
sv_jump_spam_penalty_time          0       // CS2KZ: 0
sv_ladder_angle                    -0.707  // CS2KZ: -0.707
sv_ladder_dampen                   1       // CS2KZ: 1
sv_ladder_scale_speed              1       // CS2KZ: 1 (old HNS cfg had 2: twice KZ climb speed)
sv_maxspeed                        380     // CS2KZ: 320 (only applies on the ground when hns_ps_enabled is 0)
sv_maxvelocity                     3500    // CS2KZ: 3500
sv_staminajumpcost                 0       // CS2KZ: 0
sv_staminalandcost                 0       // CS2KZ: 0
sv_staminamax                      0       // CS2KZ: 0
sv_staminarecoveryrate             9999    // CS2KZ: 9999
sv_standable_normal                0.7     // CS2KZ: 0.7
sv_step_move_vel_min               64      // CS2KZ: 64
sv_timebetweenducks                0       // CS2KZ: 0
sv_walkable_normal                 0.7     // CS2KZ: 0.7
sv_wateraccelerate                 10      // CS2KZ: 10
sv_waterfriction                   1       // CS2KZ: 1
sv_water_slow_amount               0.9     // CS2KZ: 0.9
sv_subtick_movement_view_angles    false   // CS2KZ: false
sv_legacy_jump                     true    // CS2KZ: true
sv_bhop_time_window                0.05    // CS2KZ: 0.02 (inert while sv_legacy_jump is true)
hns_solid_teammates                0       // CS2KZ: 0 (sets mp_solid_teammates: 0 = pass through, 1 = solid, 2 = solid, no head-standing)
